<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>실시간 코스 지도</title>
  <link rel="stylesheet" href="{{ url_for('static_routes.static', filename='css/main.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #0b0f17; --card: #111827; --muted: #9ca3af; --text: #e5e7eb; --border: #1f2937; }
    html[data-theme="light"] { --bg: #f7fafc; --card: #ffffff; --muted: #6b7280; --text: #111827; --border: #e5e7eb; }
    body { margin: 0; background-color: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    #map { width: 100vw; height: 80vh; }
    .runner-icon { background-color: white; border: 1px solid #555; border-radius: 5px; padding: 2px 5px; font-size: 12px; text-align: center; white-space: nowrap; color: #111; }
    .split-point-icon { background-color: rgba(0, 0, 255, 0.7); color: white; border-radius: 50%; text-align: center; line-height: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="toprow">
      <div class="title">SmartChip 라이브 스플릿</div>
      <span class="chip only-desktop">모바일 최적화</span>
      <div class="spacer"></div>
      <button class="btn ghost" id="themeBtn" aria-pressed="false" title="라이트/다크 전환">🌗 테마</button>
    </div>
  </div>
  <div class="section-head" style="margin-top:10px;">
    <a class="btn" href="{{ url_for('pages.page_group_code', group_code=group.join_code) }}">← 그룹</a>
    <div id="raceTitle" style="font-weight:700;">{{ marathon.name }} @ {{ group.name }}</div>
    <div class="spacer"></div>
  </div>

  <div id="map"></div>

  <!-- 하단 FAB: 새로고침 간격 / 수동 새로고침 -->
  <div class="fab" id="fab">
    <div class="seg" role="tablist" aria-label="자동 새로고침 간격">
      <button class="segbtn active" data-sec="1">1s</button>
      <button class="segbtn" data-sec="5">5s</button>
      <button class="segbtn" data-sec="10">10s</button>
    </div>
    <button class="btn" id="manualRefreshBtn">새로고침</button>
  </div>

  <script>
    window.MARATHON_ID = {{ marathon.id }};
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static_routes.static', filename='js/map.js') }}?v=1.2"></script>
  </body>
</body>
</html>
