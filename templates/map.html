<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>실시간 코스 지도</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --bg: #0b0f17; --card: #111827; --muted: #9ca3af; --text: #e5e7eb; --border: #1f2937; }
    html[data-theme="light"] { --bg: #f7fafc; --card: #ffffff; --muted: #6b7280; --text: #111827; --border: #e5e7eb; }
    body { margin: 0; background-color: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    #map { width: 100vw; height: 100vh; }
    .runner-icon { background-color: white; border: 1px solid #555; border-radius: 5px; padding: 2px 5px; font-size: 12px; text-align: center; white-space: nowrap; color: #111; }
    .split-point-icon { background-color: rgba(0, 0, 255, 0.7); color: white; border-radius: 50%; text-align: center; line-height: 20px; font-weight: bold; }
    .top-controls { position: absolute; top: 10px; left: 50px; z-index: 1000; background: var(--card); padding: 8px; border-radius: 8px; border: 1px solid var(--border); }
    .top-controls h1 { font-size: 16px; margin: 0 0 5px; }
    .top-controls .small { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="top-controls">
    <h1 id="marathon-name">불러오는 중...</h1>
    <div class="small" id="last-updated"></div>
  </div>

  <script>
    window.MARATHON_ID = {{ marathon_id }};
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="{{ url_for('static_routes.static', filename='js/map.js') }}"></script>
</body>
</html>
