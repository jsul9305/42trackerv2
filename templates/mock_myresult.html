
<html>
<head>
    <title>MyResult Mock</title>
    <meta http-equiv="refresh" content="5">
    <style>

        .card-player .ant-card-meta-avatar .ant-avatar{height:55px;line-height:55px;width:55px}
        .table-header,.table-row{border-bottom:1px solid #e8e8e8;color:rgba(0,0,0,.85);height:40px;line-height:40px;text-align:center;transition:background .3s ease}
        .table-header{background:#fafafa;font-weight:500}
    </style>
</head>
<body>
<div id="__nuxt">
    <div id="__layout">
        <div>
            <section class="ant-layout">
                <header class="ant-layout-header" theme="light" style="position: fixed; z-index: 1; width: 100%; padding: 0px;">
                    <a href="/" class="nuxt-link-active"><div class="logo"></div></a>
                </header>
                <main class="ant-layout-content">
                    <section data-v-3d7baa6d="" class="ant-layout" style="padding: 74px 10px 10px;">
                        <div data-v-3d7baa6d="" class="ant-card ant-card-bordered ant-card-hoverable">
                            <div class="ant-card-body">
                                <div class="ant-card-meta-title">2025 JTBC 서울마라톤</div>
                                <div class="ant-card-meta-description">
                                    2025-11-02 (일) | 상암월드컵공원
                                </div>
                            </div>
                        </div>
                        <div data-v-3d7baa6d="" class="card-player ant-card ant-card-bordered ant-card-hoverable">
                            <div class="ant-card-body">
                                <div class="ant-card-meta">
                                    <div class="ant-card-meta-avatar">
                                        <span class="ant-avatar ant-avatar-lg ant-avatar-circle" style="float: right; background-color: rgb(245, 106, 0); vertical-align: middle;">
                                            <span class="ant-avatar-string" style="transform: scale(1) translateX(-50%);">Full</span>
                                        </span>
                                    </div>
                                    <div class="ant-card-meta-detail">
                                        <div class="ant-card-meta-title">{{ runner_info.name }}</div>
                                        <div class="ant-card-meta-description">남자 | #{{ runner_info.bib }}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div data-v-3d7baa6d="" class="ant-tabs ant-tabs-top ant-tabs-line">
                            <div role="tablist" tabindex="0" class="ant-tabs-bar ant-tabs-top-bar">
                                <div class="ant-tabs-nav-container">
                                    <div class="ant-tabs-nav-wrap">
                                        <div class="ant-tabs-nav-scroll">
                                            <div class="ant-tabs-nav ant-tabs-nav-animated">
                                                <div class="ant-tabs-ink-bar ant-tabs-ink-bar-animated" style="display: block; transform: translate3d(0px, 0px, 0px); width: 58px;"></div>
                                                <div class="ant-tabs-tab-active ant-tabs-tab">
                                                    기록
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div style="">
                                <div role="tabpanel" aria-hidden="false" class="ant-tabs-tabpane ant-tabs-tabpane-active">
                                    <div data-v-3d7baa6d="" class="table-header ant-row">
                                        <div data-v-3d7baa6d="" class="ant-col ant-col-6">구간</div>
                                        <div data-v-3d7baa6d="" class="ant-col ant-col-6">시간</div>
                                        <div data-v-3d7baa6d="" class="ant-col ant-col-6">구간기록</div>
                                        <div data-v-3d7baa6d="" class="ant-col ant-col-6">누적기록</div>
                                    </div>
                                    <div data-v-3d7baa6d="">
                                        {% for split in splits %}
                                        <div data-v-3d7baa6d="" class="table-row ant-row">
                                            <div data-v-3d7baa6d="" class="ant-col ant-col-6">{{ split.point }}</div>
                                            <div data-v-3d7baa6d="" class="ant-col ant-col-6">{{ split.pass_clock }}</div>
                                            <div data-v-3d7baa6d="" class="ant-col ant-col-6">{{ split.interval }}</div>
                                            <div data-v-3d7baa6d="" class="ant-col ant-col-6">{{ split.net_time }}</div>
                                        </div>
                                        {% endfor %}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </main>
                <footer class="ant-layout-footer" align="center">
                    ⓒ MyResult Corp
                </footer>
            </section>
        </div>
    </div>
</div>
</body>
</html>
